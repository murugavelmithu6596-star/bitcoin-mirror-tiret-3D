<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Image fixe — ruban attaché au ballon -->
  <rect width="480" height="270" fill="#eaf1f5"/>
  <rect x="0" y="220" width="480" height="50" fill="#d5e0e8"/>
  <line x1="0" y1="220" x2="480" y2="220" stroke="#9aabbb" stroke-width="1.5"/>

  <!-- Paroi -->
  <rect x="420" y="30" width="22" height="190" fill="#9db0bf" rx="2"/>
  <text x="431" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5a68">Paroi</text>

  <!-- Trajectoire aller -->
  <path d="M 210 128 C 285 88, 350 72, 415 95" fill="none" stroke="#2a6f97" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="415,95 405,90 407,100" fill="#2a6f97"/>
  <!-- Trajectoire retour -->
  <path d="M 415 100 C 330 150, 250 165, 155 148" fill="none" stroke="#c45c3e" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="155,148 165,143 163,155" fill="#c45c3e"/>
  <text x="305" y="62" font-family="Arial, sans-serif" font-size="10" fill="#2a6f97">tir</text>
  <text x="285" y="182" font-family="Arial, sans-serif" font-size="10" fill="#c45c3e">rebond → main</text>

  <!-- Homme -->
  <g transform="translate(70,100)">
    <line x1="0" y1="70" x2="-10" y2="118" stroke="#3a4d5e" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="70" x2="12" y2="118" stroke="#3a4d5e" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="28" x2="0" y2="70" stroke="#5a7d9a" stroke-width="11" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="12" fill="#e8b89a"/>
    <line x1="0" y1="38" x2="-14" y2="62" stroke="#e8b89a" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="38" x2="42" y2="34" stroke="#e8b89a" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="45" cy="32" r="5.5" fill="#e8b89a"/>
    <line x1="45" y1="29" x2="52" y2="22" stroke="#e8b89a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="70" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5a68">Homme</text>

  <!-- Main (bout du ruban que l'homme tire) -->
  <circle cx="115" cy="132" r="3" fill="#5a7d9a"/>

  <!--
    Ruban fin type élastique à cheveux :
    - bout gauche = main de l'homme
    - bout droit = boucle attachée autour / sur la sphère
  -->
  <!-- Corps du ruban (main → bord gauche de la sphère) -->
  <path d="M 115 132 Q 150 120, 188 128"
        fill="none" stroke="#e6b84d" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Boucle d'attache autour du ballon (comme un élastique à cheveux) -->
  <ellipse cx="210" cy="125" rx="24" ry="10"
           fill="none" stroke="#e6b84d" stroke-width="2.4"/>
  <!-- Nœud / jonction visible sur le ballon -->
  <circle cx="188" cy="128" r="3.2" fill="#d4a017" stroke="#a67c1a" stroke-width="0.8"/>

  <text x="138" y="112" font-family="Arial, sans-serif" font-size="10" fill="#a67c1a">Ruban fin</text>
  <text x="210" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#a67c1a">attaché</text>

  <!-- Sphère 6 cm (au-dessus du ruban d'attache pour qu'on voie la boucle) -->
  <circle cx="210" cy="125" r="22" fill="#eb4752" stroke="#c93a44" stroke-width="1.2"/>
  <!-- Petite portion de boucle devant le ballon pour montrer qu'elle l'entoure -->
  <path d="M 190 133 Q 210 136, 230 133"
        fill="none" stroke="#e6b84d" stroke-width="2.2" stroke-linecap="round"/>
  <text x="210" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">6 cm</text>

  <!-- Légende -->
  <rect x="12" y="10" width="248" height="36" rx="6" fill="#fff" fill-opacity="0.95" stroke="#c9d5df"/>
  <text x="22" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#243040">Ruban relié au ballon — image fixe</text>
</svg>
