<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Image fixe — pas d'animation -->
  <rect width="480" height="270" fill="#eaf1f5"/>
  <rect x="0" y="220" width="480" height="50" fill="#d5e0e8"/>
  <line x1="0" y1="220" x2="480" y2="220" stroke="#9aabbb" stroke-width="1.5"/>

  <!-- Paroi -->
  <rect x="420" y="30" width="22" height="190" fill="#9db0bf" rx="2"/>
  <text x="431" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5a68">Paroi</text>

  <!-- Trajectoire aller (tiré vers la paroi) -->
  <path d="M 195 125 C 270 85, 340 70, 415 95" fill="none" stroke="#2a6f97" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="415,95 405,90 407,100" fill="#2a6f97"/>
  <!-- Trajectoire retour (rebond → personne) -->
  <path d="M 415 100 C 330 150, 250 165, 160 145" fill="none" stroke="#c45c3e" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="160,145 170,140 168,152" fill="#c45c3e"/>
  <text x="300" y="62" font-family="Arial, sans-serif" font-size="10" fill="#2a6f97">tir</text>
  <text x="280" y="180" font-family="Arial, sans-serif" font-size="10" fill="#c45c3e">rebond → main</text>

  <!-- Homme -->
  <g transform="translate(70,100)">
    <line x1="0" y1="70" x2="-10" y2="118" stroke="#3a4d5e" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="70" x2="12" y2="118" stroke="#3a4d5e" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="28" x2="0" y2="70" stroke="#5a7d9a" stroke-width="11" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="12" fill="#e8b89a"/>
    <line x1="0" y1="38" x2="-14" y2="62" stroke="#e8b89a" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="38" x2="42" y2="34" stroke="#e8b89a" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="45" cy="32" r="5.5" fill="#e8b89a"/>
    <!-- pouce -->
    <line x1="45" y1="29" x2="52" y2="22" stroke="#e8b89a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="70" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5a68">Homme</text>

  <!-- Ruban fin tendu vers l'arrière -->
  <line x1="115" y1="132" x2="175" y2="128" stroke="#e6b84d" stroke-width="2.2" stroke-linecap="round"/>
  <text x="130" y="118" font-family="Arial, sans-serif" font-size="10" fill="#a67c1a">Ruban fin</text>

  <!-- Sphère 6 cm tirée en arrière -->
  <circle cx="195" cy="125" r="22" fill="#eb4752" stroke="#c93a44" stroke-width="1.2"/>
  <text x="195" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">6 cm</text>

  <!-- Légende -->
  <rect x="12" y="10" width="200" height="36" rx="6" fill="#fff" fill-opacity="0.95" stroke="#c9d5df"/>
  <text x="22" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#243040">Image fixe — lance-pierres</text>
</svg>
