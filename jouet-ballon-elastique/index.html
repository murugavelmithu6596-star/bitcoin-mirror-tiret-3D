<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ballon à élastique — rebond simple</title>
  <style>
    :root {
      --bg: #e8f0f4;
      --ink: #2a3340;
      --accent: #eb4752;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    #c { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 2;
      background: rgba(255,255,255,.88); border: 1px solid #c5d0da;
      padding: .75rem 1rem; border-radius: 8px; max-width: 19rem;
      box-shadow: 0 4px 16px rgba(30,50,70,.08);
    }
    .hud h1 { margin: 0 0 .35rem; font-size: 1rem; font-weight: 650; }
    .hud p { margin: 0 0 .65rem; font-size: .82rem; line-height: 1.35; opacity: .85; }
    .hud code { font-size: .78rem; }
    button {
      appearance: none; border: 0; background: var(--accent); color: #fff;
      font: inherit; font-weight: 600; font-size: .85rem;
      padding: .45rem .9rem; border-radius: 6px; cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: .55; cursor: wait; }
    .swatches { display: flex; gap: .4rem; margin-top: .55rem; flex-wrap: wrap; }
    .swatch { width: .7rem; height: .7rem; border-radius: 2px; border: 1px solid rgba(0,0,0,.12); }
    #status { font-size: .75rem; opacity: .7; margin-top: .5rem; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <h1>Ballon + élastique + paroi</h1>
    <p>Modèle <code>models/ballon_elastique.obj</code> (Y-up). Glisser = orbit · molette = zoom.</p>
    <button type="button" id="replay" disabled>Chargement…</button>
    <div class="swatches" title="Couleurs MTL">
      <span class="swatch" style="background:#eb4752" title="Ballon"></span>
      <span class="swatch" style="background:#f2e0b8" title="Élastique"></span>
      <span class="swatch" style="background:#c28c52" title="Base"></span>
      <span class="swatch" style="background:#9db0bf" title="Paroi"></span>
    </div>
    <div id="status">Chargement du modèle 3D…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { MTLLoader } from "three/addons/loaders/MTLLoader.js";
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

    /**
     * OBJ source : millimètres, Z-up.
     * Scène Three.js : Y-up.
     * Conversion : scale mm→unités scène, puis rotation X −90°.
     * Échelle choisie pour un jouet lisible face à la paroi (~ballon Ø 4–5 cm à l’écran).
     */
    const SCALE = 0.018; // mm → unités scène (ballon Ø ≈ 0.79)
    const BALL_R_MM = 22;
    const BALL_R = BALL_R_MM * SCALE;
    const BASE_TOP_Y = 10 * SCALE; // sommet base (z=10 mm → y)
    const ANCHOR = new THREE.Vector3(0, BASE_TOP_Y, 0);
    // Longueur au repos courte : le ballon peut atteindre la paroi avant d’être rappelé
    const REST_LEN = 0.85;
    const WALL_X = 1.45;

    const canvas = document.getElementById("c");
    const statusEl = document.getElementById("status");
    const replayBtn = document.getElementById("replay");

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8f0f4);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 50);
    // Cadrage large : base + ballon + paroi visibles même en fenêtre basse (~660 px)
    camera.position.set(0.35, 1.45, 4.8);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0.55, 0.7, 0);
    controls.enableDamping = true;
    controls.minDistance = 2.0;
    controls.maxDistance = 10;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun = new THREE.DirectionalLight(0xfff4e8, 1.15);
    sun.position.set(1.5, 3.5, 2.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xdce9f5, 0.35);
    fill.position.set(-2, 1.5, -1);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(4.5, 48),
      new THREE.MeshStandardMaterial({ color: 0xd5e2ea, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Repère Y-up discret (aide visuelle légère)
    const axes = new THREE.AxesHelper(0.35);
    axes.position.set(-0.55, 0.02, -0.55);
    scene.add(axes);

    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 2.1, 2.4),
      new THREE.MeshStandardMaterial({
        color: 0x9db0bf,
        roughness: 0.85,
        transparent: true,
        opacity: 0.72,
      })
    );
    wall.position.set(WALL_X + 0.025, 1.05, 0);
    wall.receiveShadow = true;
    scene.add(wall);

    /** @type {THREE.Object3D|null} */
    let ball = null;
    /** @type {THREE.Object3D|null} */
    let elastic = null;
    let elasticRestVisual = REST_LEN;

    const state = {
      ready: false,
      bouncing: true,
      bounceCount: 0,
      maxBounces: 2,
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
    };

    const K = 12;
    const DAMP = 0.45;
    const REST = 0.68;
    const GRAV = -3.0;

    function findNamed(root, name) {
      let found = null;
      root.traverse((o) => {
        if (o.name === name) found = o;
      });
      return found;
    }

    function enableShadows(root) {
      root.traverse((c) => {
        if (!c.isMesh) return;
        c.castShadow = true;
        c.receiveShadow = true;
        const mats = Array.isArray(c.material) ? c.material : [c.material];
        for (const m of mats) {
          if (!m) continue;
          m.side = THREE.DoubleSide;
          // Lisibilité jouet sous lumières scène
          if ("specular" in m) m.specular = new THREE.Color(0x333333);
        }
      });
    }

    /** Pivot centré sur la bbox monde (pour animer position / stretch). */
    function pivotAroundCenter(object) {
      object.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const pivot = new THREE.Group();
      pivot.name = `${object.name}Pivot`;
      pivot.position.copy(center);
      scene.add(pivot);
      pivot.attach(object);
      return { pivot, size, center };
    }

    function frameToyAndWall() {
      // Vue de trois-quarts, assez éloignée pour garder ballon + rebond dans le cadre
      const focus = new THREE.Vector3(WALL_X * 0.4, 0.7, 0);
      controls.target.copy(focus);
      camera.position.set(focus.x - 0.35, 1.45, 4.8);
      camera.near = 0.05;
      camera.far = 50;
      camera.updateProjectionMatrix();
      controls.update();
    }

    function updateElastic(pos) {
      if (!elastic) return;
      const mid = ANCHOR.clone().add(pos).multiplyScalar(0.5);
      const dir = pos.clone().sub(ANCHOR);
      const len = Math.max(dir.length(), 0.01);
      elastic.position.copy(mid);
      elastic.scale.set(1, len / elasticRestVisual, 1);
      elastic.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        dir.normalize()
      );
    }

    function reset() {
      if (!state.ready || !ball) return;
      // Départ entre base et paroi, vitesse franche vers le mur (1–2 rebonds)
      state.pos.set(0.4, 0.75, 0.0);
      state.vel.set(3.4, 0.55, 0.0);
      state.bounceCount = 0;
      state.bouncing = true;
      ball.position.copy(state.pos);
      updateElastic(state.pos);
    }

    function step(dt) {
      if (!state.ready || !state.bouncing || !ball) return;
      dt = Math.min(dt, 1 / 30);

      const toAnchor = ANCHOR.clone().sub(state.pos);
      const dist = toAnchor.length();
      const dir = toAnchor.multiplyScalar(1 / Math.max(dist, 1e-6));
      const force = dir.multiplyScalar(K * (dist - REST_LEN));
      force.y += GRAV;

      state.vel.addScaledVector(force, dt);
      state.vel.multiplyScalar(1 - DAMP * dt);
      state.pos.addScaledVector(state.vel, dt);

      if (state.pos.x + BALL_R > WALL_X && state.vel.x > 0) {
        state.pos.x = WALL_X - BALL_R;
        state.vel.x *= -REST;
        state.bounceCount += 1;
      }

      if (state.pos.y < BALL_R) {
        state.pos.y = BALL_R;
        state.vel.y *= -0.35;
      }

      if (
        state.bounceCount >= 1 &&
        state.vel.length() < 0.12 &&
        Math.abs(dist - REST_LEN) < 0.1
      ) {
        state.bouncing = false;
        state.vel.set(0, 0, 0);
      }

      ball.position.copy(state.pos);
      updateElastic(state.pos);
    }

    replayBtn.addEventListener("click", () => {
      frameToyAndWall();
      reset();
    });

    // Cadrage dès le premier frame (avant chargement OBJ)
    frameToyAndWall();

    const mtlLoader = new MTLLoader();
    mtlLoader.setPath("models/");
    mtlLoader.load(
      "ballon_elastique.mtl",
      (materials) => {
        materials.preload();
        const objLoader = new OBJLoader();
        objLoader.setMaterials(materials);
        objLoader.setPath("models/");
        objLoader.load(
          "ballon_elastique.obj",
          (root) => {
            // mm Z-up → scène Y-up
            root.scale.setScalar(SCALE);
            root.rotation.x = -Math.PI / 2;
            root.position.set(0, 0, 0);
            scene.add(root);
            root.updateMatrixWorld(true);
            enableShadows(root);

            const baseObj = findNamed(root, "base");
            const ballObj = findNamed(root, "ballon");
            const elasticObj = findNamed(root, "elastique");

            if (!baseObj || !ballObj || !elasticObj) {
              statusEl.textContent = "Objets base / ballon / elastique introuvables.";
              return;
            }

            // Base reste au sol (origine), Y-up
            baseObj.position.y = 0;

            const ballParts = pivotAroundCenter(ballObj);
            ball = ballParts.pivot;

            const elParts = pivotAroundCenter(elasticObj);
            elastic = elParts.pivot;
            // Axe long après rot −90°X = Y monde
            elasticRestVisual = Math.max(elParts.size.y, REST_LEN * 0.5);

            frameToyAndWall();
            state.ready = true;
            replayBtn.disabled = false;
            replayBtn.textContent = "Rejouer";
            statusEl.textContent = "Prêt — ballon, élastique et paroi cadrés.";
            reset();
          },
          (xhr) => {
            if (xhr.total) {
              statusEl.textContent = `OBJ ${Math.round((xhr.loaded / xhr.total) * 100)} %`;
            }
          },
          (err) => {
            console.error(err);
            statusEl.textContent = "Échec OBJ — servez ce dossier en HTTP.";
          }
        );
      },
      undefined,
      (err) => {
        console.error(err);
        statusEl.textContent = "Échec MTL.";
      }
    );

    let last = performance.now();
    function frame(now) {
      const dt = (now - last) / 1000;
      last = now;
      step(dt);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
