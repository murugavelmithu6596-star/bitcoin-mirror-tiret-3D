<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Tirer → paroi → main — ballon taille main</title>
  <style>
    :root {
      --bg: #eaf1f5;
      --ink: #243040;
      --accent: #e94b52;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    #c { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 2;
      background: rgba(255,255,255,.92); border: 1px solid #c9d5df;
      padding: .85rem 1rem; border-radius: 10px; width: min(20rem, calc(100vw - 2rem));
      box-shadow: 0 6px 20px rgba(30,50,70,.1);
    }
    .hud h1 { margin: 0 0 .4rem; font-size: 1.02rem; font-weight: 700; }
    .steps { display: flex; gap: .35rem; margin: 0 0 .65rem; }
    .steps span {
      flex: 1; text-align: center; font-size: .68rem; font-weight: 650;
      padding: .35rem .15rem; border-radius: 6px; background: #eef3f7; color: #6a7888;
    }
    .steps span.on { background: var(--accent); color: #fff; }
    .data {
      margin: 0 0 .7rem; font-size: .76rem; line-height: 1.45;
      padding: .5rem .6rem; border-radius: 6px; background: #f4f8fb;
    }
    button {
      appearance: none; border: 0; width: 100%;
      background: var(--accent); color: #fff;
      font: inherit; font-weight: 700; font-size: .9rem;
      padding: .55rem .9rem; border-radius: 8px; cursor: pointer;
    }
    #status { margin-top: .55rem; font-size: .75rem; opacity: .7; text-align: center; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <h1>Tirer → paroi → main</h1>
    <div class="steps" id="steps">
      <span data-s="pull">1. Tirer</span>
      <span data-s="bounce">2. Paroi</span>
      <span data-s="return">3. Main</span>
    </div>
    <div class="data">
      Ballon <strong>taille de la main</strong> (pas plus gros)<br />
      Élastique fin accroché à la <strong>main</strong><br />
      Lâcher → rebond paroi → retour vers la main
    </div>
    <button type="button" id="replay">Rejouer</button>
    <div id="status">…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // Unités scène ≈ cm. Main (sphère) r≈0.36 → ballon un peu plus petit que la paume
    const HAND_R = 0.36;
    const BALL_R = 0.40; // taille main — pas plus gros
    const ELASTIC_R = 0.06; // fil fin proportionné
    const REST_LEN = 5.5;
    const WALL_X = 14;

    const statusEl = document.getElementById("status");
    const stepEls = [...document.querySelectorAll("#steps span")];
    function setStepUI(name) {
      stepEls.forEach((el) => el.classList.toggle("on", el.dataset.s === name));
    }

    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeaf1f5);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 200);
    camera.position.set(3, 11, 26);
    const controls = new OrbitControls(camera, canvas);
    controls.target.set(4, 5, 0);
    controls.enableDamping = true;
    controls.minDistance = 12;
    controls.maxDistance = 50;

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const sun = new THREE.DirectionalLight(0xfff5ea, 1.05);
    sun.position.set(8, 22, 12);
    sun.castShadow = true;
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(36, 48),
      new THREE.MeshStandardMaterial({ color: 0xd7e3ea, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 20, 18),
      new THREE.MeshStandardMaterial({ color: 0x9db0bf, transparent: true, opacity: 0.68, roughness: 0.85 })
    );
    wall.position.set(WALL_X + 0.2, 10, 0);
    scene.add(wall);

    // Ballon
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(BALL_R, 24, 18),
      new THREE.MeshStandardMaterial({ color: 0xe94b52, roughness: 0.4 })
    );
    ball.castShadow = true;
    scene.add(ball);

    // Élastique fin (main → ballon) — pas de ruban
    const elastic = new THREE.Mesh(
      new THREE.CylinderGeometry(ELASTIC_R, ELASTIC_R, 1, 8),
      new THREE.MeshStandardMaterial({ color: 0xebd9b8, roughness: 0.55 })
    );
    scene.add(elastic);

    function updateElastic(anchor, tip) {
      const mid = anchor.clone().add(tip).multiplyScalar(0.5);
      const dir = tip.clone().sub(anchor);
      const len = Math.max(dir.length(), 0.05);
      elastic.position.copy(mid);
      elastic.scale.set(1, len, 1);
      elastic.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    }

    function makePerson() {
      const g = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: 0xe8b89a, roughness: 0.7 });
      const cloth = new THREE.MeshStandardMaterial({ color: 0x5a7d9a, roughness: 0.65 });
      const pants = new THREE.MeshStandardMaterial({ color: 0x3a4d5e, roughness: 0.7 });

      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(1.05, 2.2, 4, 8), cloth);
      torso.position.y = 5.0;
      torso.castShadow = true;
      g.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(1.0, 14, 12), skin);
      head.position.y = 7.3;
      head.castShadow = true;
      g.add(head);

      const armR = new THREE.Group();
      armR.position.set(1.3, 5.9, 0);
      const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 1.45, 3, 6), skin);
      upper.position.y = -0.9;
      armR.add(upper);
      const hand = new THREE.Mesh(new THREE.SphereGeometry(HAND_R, 12, 10), skin);
      hand.position.y = -1.9;
      armR.add(hand);
      g.add(armR);

      const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 1.45, 3, 6), skin);
      armL.position.set(-1.3, 5.0, 0);
      g.add(armL);

      const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 2.1, 3, 6), pants);
      legL.position.set(-0.5, 1.9, 0);
      g.add(legL);
      const legR = legL.clone();
      legR.position.x = 0.5;
      g.add(legR);

      g.userData = { armR, hand };
      return g;
    }

    const person = makePerson();
    person.position.set(-5.5, 0, 2);
    person.rotation.y = 0.4;
    scene.add(person);

    function setArm(amount) {
      const arm = person.userData.armR;
      arm.rotation.x = -0.15 - amount * 1.2;
      arm.rotation.z = -0.1 - amount * 0.25;
      arm.rotation.y = amount * 0.35;
    }

    function handWorld() {
      const p = new THREE.Vector3();
      person.userData.hand.getWorldPosition(p);
      return p;
    }

    const state = {
      phase: "pull", // pull | bounce | done
      t: 0,
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      bounceCount: 0,
      hitWall: false,
    };

    const K = 9.5;       // rappel ferme vers la main
    const DAMP = 0.55;
    const REST = 0.72;   // restitution paroi
    const GRAV = -16;

    function reset() {
      state.phase = "pull";
      state.t = 0;
      state.bounceCount = 0;
      state.hitWall = false;
      state.vel.set(0, 0, 0);
      person.position.set(-5.5, 0, 2);
      setArm(0);
      setStepUI("pull");
      statusEl.textContent = "Il saisit le ballon…";
      const h = handWorld();
      state.pos.copy(h).add(new THREE.Vector3(0.7, 0.1, 0));
      ball.position.copy(state.pos);
      updateElastic(h, state.pos);
    }

    function stepPull(dt) {
      state.t += dt;
      const t = state.t;

      if (t < 0.65) {
        const u = t / 0.65;
        person.position.x = -5.5 + u * 2.0;
        person.position.z = 2 - u * 1.0;
        setArm(u * 0.8);
        const h = handWorld();
        state.pos.copy(h).add(new THREE.Vector3(0.65, 0.1, 0));
        statusEl.textContent = "Prise en main…";
      } else if (t < 1.7) {
        const u = (t - 0.65) / 1.05;
        setArm(0.8 + u * 0.2);
        // Tire en arrière (charge) — ballon reste dans la main
        person.position.x = -3.5 - u * 1.8;
        person.position.z = 1.0;
        const h = handWorld();
        state.pos.copy(h).add(new THREE.Vector3(0.55, 0.12, 0));
        statusEl.textContent = "Il tire…";
      } else {
        // Lâcher vers la paroi
        setArm(0.25);
        state.phase = "bounce";
        state.t = 0;
        state.vel.set(26, 5, 0); // vers la paroi
        setStepUI("bounce");
        statusEl.textContent = "Lâché → vers la paroi…";
      }

      ball.position.copy(state.pos);
      updateElastic(handWorld(), state.pos);
    }

    function stepBounce(dt) {
      state.t += dt;
      setArm(Math.max(0.1, 0.3 - state.t * 0.08));

      // Ancrage = main de l'homme (retour vers la main)
      const anchor = handWorld();

      const toA = anchor.clone().sub(state.pos);
      const dist = toA.length();
      const dir = toA.multiplyScalar(1 / Math.max(dist, 1e-6));
      const force = dir.multiplyScalar(K * (dist - REST_LEN));
      force.y += GRAV;

      state.vel.addScaledVector(force, dt);
      state.vel.multiplyScalar(1 - DAMP * dt);
      state.pos.addScaledVector(state.vel, dt);

      // ——— Rebond sur la paroi verticale ———
      if (state.pos.x + BALL_R > WALL_X && state.vel.x > 0) {
        state.pos.x = WALL_X - BALL_R;
        state.vel.x *= -REST;
        state.bounceCount += 1;
        state.hitWall = true;
        setStepUI("return");
        statusEl.textContent = "Rebond paroi → retour main…";
      }

      if (state.pos.y < BALL_R) {
        state.pos.y = BALL_R;
        state.vel.y *= -0.25;
      }

      // Arrêt : après au moins 1 rebond mur, ballon revenu près de la main
      const nearHand = state.pos.distanceTo(anchor) < REST_LEN * 0.55 + BALL_R;
      if (state.hitWall && state.vel.length() < 2.0 && nearHand) {
        state.phase = "done";
        state.vel.set(0, 0, 0);
        state.pos.copy(anchor).add(new THREE.Vector3(0.55, 0.1, 0));
        statusEl.textContent = "De retour dans la main";
        setStepUI("return");
      }

      // Sécurité : si jamais pas de mur après longtemps, forcer retour
      if (!state.hitWall && state.t > 2.5) {
        statusEl.textContent = "Retour vers la main…";
        setStepUI("return");
      }

      ball.position.copy(state.pos);
      updateElastic(anchor, state.pos);
    }

    function step(dt) {
      if (state.phase === "pull") stepPull(dt);
      else if (state.phase === "bounce") stepBounce(dt);
      else {
        const h = handWorld();
        ball.position.copy(state.pos);
        updateElastic(h, state.pos);
      }
    }

    document.getElementById("replay").addEventListener("click", reset);
    reset();

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 1 / 30);
      last = now;
      step(dt);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
