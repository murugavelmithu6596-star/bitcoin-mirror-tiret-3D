<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tirer & rebondir — ballon 3 cm</title>
  <style>
    :root {
      --bg: #eaf1f5;
      --ink: #243040;
      --accent: #e94b52;
      --ribbon: #f0c24d;
      --wood: #c4894e;
      --guy: #5a7d9a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    #c { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 2;
      background: rgba(255,255,255,.92); border: 1px solid #c9d5df;
      padding: .85rem 1rem; border-radius: 10px; width: min(20rem, calc(100vw - 2rem));
      box-shadow: 0 6px 20px rgba(30,50,70,.1);
    }
    .hud h1 { margin: 0 0 .4rem; font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
    .steps { display: flex; gap: .4rem; margin: 0 0 .65rem; }
    .steps span {
      flex: 1; text-align: center; font-size: .72rem; font-weight: 650;
      padding: .35rem .2rem; border-radius: 6px; background: #eef3f7; color: #6a7888;
    }
    .steps span.on { background: var(--accent); color: #fff; }
    .data {
      margin: 0 0 .7rem; font-size: .78rem; line-height: 1.45;
      padding: .5rem .6rem; border-radius: 6px; background: #f4f8fb;
    }
    .data strong { font-weight: 700; }
    button {
      appearance: none; border: 0; width: 100%;
      background: var(--accent); color: #fff;
      font: inherit; font-weight: 700; font-size: .9rem;
      padding: .55rem .9rem; border-radius: 8px; cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    #status { margin-top: .55rem; font-size: .75rem; opacity: .7; text-align: center; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <h1>Tirer → rebondir</h1>
    <div class="steps" id="steps">
      <span data-s="pull">1. Tirer</span>
      <span data-s="bounce">2. Rebondir</span>
    </div>
    <div class="data">
      Ballon <strong>3 × 3 cm</strong><br />
      r = 1,5 cm · V = 4/3 π r³ ≈ <strong>14,14 cm³</strong><br />
      Ruban + personnage + paroi
    </div>
    <button type="button" id="replay">Rejouer</button>
    <div id="status">…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // ——— Données simples (cm) ———
    const BALL_W = 3;
    const BALL_H = 3;
    const BALL_R = 1.5;
    const BALL_V = (4 / 3) * Math.PI * BALL_R ** 3; // ≈ 14.14 cm³
    const ANCHOR = new THREE.Vector3(0, 0.8, 0);
    const REST_LEN = 8;
    const WALL_X = 15;

    const statusEl = document.getElementById("status");
    const stepEls = [...document.querySelectorAll("#steps span")];

    function setStepUI(name) {
      stepEls.forEach((el) => el.classList.toggle("on", el.dataset.s === name));
    }

    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeaf1f5);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 200);
    camera.position.set(4, 12, 28);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(5, 5, 0);
    controls.enableDamping = true;
    controls.minDistance = 14;
    controls.maxDistance = 55;

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const sun = new THREE.DirectionalLight(0xfff5ea, 1.05);
    sun.position.set(8, 22, 12);
    sun.castShadow = true;
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(36, 48),
      new THREE.MeshStandardMaterial({ color: 0xd7e3ea, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 20, 18),
      new THREE.MeshStandardMaterial({ color: 0x9db0bf, transparent: true, opacity: 0.68, roughness: 0.85 })
    );
    wall.position.set(WALL_X + 0.2, 10, 0);
    scene.add(wall);

    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(1.15, 1.35, 0.75, 24),
      new THREE.MeshStandardMaterial({ color: 0xc4894e, roughness: 0.55 })
    );
    base.position.set(0, 0.38, 0);
    base.castShadow = true;
    scene.add(base);

    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(BALL_R, 28, 20),
      new THREE.MeshStandardMaterial({ color: 0xe94b52, roughness: 0.4 })
    );
    ball.castShadow = true;
    scene.add(ball);

    const ribbon = new THREE.Mesh(
      new THREE.BoxGeometry(0.65, 1, 0.07),
      new THREE.MeshStandardMaterial({ color: 0xf0c24d, roughness: 0.45, side: THREE.DoubleSide })
    );
    ribbon.castShadow = true;
    scene.add(ribbon);

    function updateRibbon(pos) {
      const tip = pos.clone();
      tip.y -= BALL_R * 0.2;
      const mid = ANCHOR.clone().add(tip).multiplyScalar(0.5);
      const dir = tip.clone().sub(ANCHOR);
      const len = Math.max(dir.length(), 0.05);
      ribbon.position.copy(mid);
      ribbon.scale.set(1, len, 1);
      ribbon.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    }

    // Personnage simple
    function makePerson() {
      const g = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: 0xe8b89a, roughness: 0.7 });
      const cloth = new THREE.MeshStandardMaterial({ color: 0x5a7d9a, roughness: 0.65 });
      const pants = new THREE.MeshStandardMaterial({ color: 0x3a4d5e, roughness: 0.7 });

      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(1.05, 2.2, 4, 8), cloth);
      torso.position.y = 5.0;
      torso.castShadow = true;
      g.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(1.0, 14, 12), skin);
      head.position.y = 7.3;
      head.castShadow = true;
      g.add(head);

      const armR = new THREE.Group();
      armR.position.set(1.3, 5.9, 0);
      const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 1.45, 3, 6), skin);
      upper.position.y = -0.9;
      armR.add(upper);
      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.32, 10, 8), skin);
      hand.position.y = -1.9;
      armR.add(hand);
      g.add(armR);

      const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 1.45, 3, 6), skin);
      armL.position.set(-1.3, 5.0, 0);
      g.add(armL);

      const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 2.1, 3, 6), pants);
      legL.position.set(-0.5, 1.9, 0);
      g.add(legL);
      const legR = legL.clone();
      legR.position.x = 0.5;
      g.add(legR);

      g.userData = { armR, hand };
      return g;
    }

    const person = makePerson();
    person.position.set(-6, 0, 2);
    person.rotation.y = 0.45;
    scene.add(person);

    function setArm(amount) {
      const arm = person.userData.armR;
      arm.rotation.x = -0.15 - amount * 1.25;
      arm.rotation.z = -0.1 - amount * 0.25;
      arm.rotation.y = amount * 0.35;
    }

    // Phases : pull | bounce | done
    const state = {
      phase: "pull",
      t: 0,
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      bounceCount: 0,
    };

    const K = 3.2;
    const DAMP = 0.5;
    const REST = 0.7;
    const GRAV = -20;

    function reset() {
      state.phase = "pull";
      state.t = 0;
      state.bounceCount = 0;
      state.vel.set(0, 0, 0);
      state.pos.set(0, ANCHOR.y + REST_LEN, 0);
      person.position.set(-6, 0, 2);
      setArm(0);
      setStepUI("pull");
      statusEl.textContent = "Le personnage tire le ruban…";
      ball.position.copy(state.pos);
      updateRibbon(state.pos);
    }

    function stepPull(dt) {
      state.t += dt;
      // 0–0.8 s : approche + grab ; 0.8–2.0 s : tirage ; puis lâcher
      const t = state.t;

      if (t < 0.8) {
        const u = t / 0.8;
        person.position.x = -6 + u * 2.5;
        person.position.z = 2 - u * 1.2;
        setArm(u * 0.75);
        state.pos.set(0, ANCHOR.y + REST_LEN, 0);
      } else if (t < 2.0) {
        const u = (t - 0.8) / 1.2;
        setArm(0.75 + u * 0.25);
        person.position.x = -3.5 - u * 1.2;
        // Tire en arrière (loin du mur) pour charger le rebond
        state.pos.set(
          -u * 4.5,
          ANCHOR.y + REST_LEN * (0.7 + u * 0.15),
          1.2
        );
        statusEl.textContent = "Tirer…";
      } else {
        // Lâcher vers la paroi
        setArm(0.2);
        state.phase = "bounce";
        state.t = 0;
        state.vel.set(28, 6, 0);
        setStepUI("bounce");
        statusEl.textContent = "Rebondir…";
      }

      ball.position.copy(state.pos);
      updateRibbon(state.pos);
    }

    function stepBounce(dt) {
      state.t += dt;
      setArm(Math.max(0, 0.25 - state.t * 0.2));

      const toA = ANCHOR.clone().sub(state.pos);
      const dist = toA.length();
      const dir = toA.multiplyScalar(1 / Math.max(dist, 1e-6));
      const force = dir.multiplyScalar(K * (dist - REST_LEN));
      force.y += GRAV;

      state.vel.addScaledVector(force, dt);
      state.vel.multiplyScalar(1 - DAMP * dt);
      state.pos.addScaledVector(state.vel, dt);

      if (state.pos.x + BALL_R > WALL_X && state.vel.x > 0) {
        state.pos.x = WALL_X - BALL_R;
        state.vel.x *= -REST;
        state.bounceCount += 1;
        statusEl.textContent = `Rebond ${state.bounceCount}`;
      }
      if (state.pos.y < BALL_R) {
        state.pos.y = BALL_R;
        state.vel.y *= -0.28;
      }

      if (state.bounceCount >= 1 && state.vel.length() < 1.5 && Math.abs(dist - REST_LEN) < 1.5) {
        state.phase = "done";
        state.vel.set(0, 0, 0);
        statusEl.textContent = `OK · V ≈ ${BALL_V.toFixed(2)} cm³`;
      }

      ball.position.copy(state.pos);
      updateRibbon(state.pos);
    }

    function step(dt) {
      if (state.phase === "pull") stepPull(dt);
      else if (state.phase === "bounce") stepBounce(dt);
      else {
        ball.position.copy(state.pos);
        updateRibbon(state.pos);
      }
    }

    document.getElementById("replay").addEventListener("click", reset);
    reset();

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 1 / 30);
      last = now;
      step(dt);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
